name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: verify tag matches mod version
        run: |
          MOD_VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n1)"
          if [ "v${MOD_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gradle.properties version v${MOD_VERSION}"
            exit 1
          fi

      - name: build and test
        run: ./gradlew build

      # Internal record of each release. Player-facing distribution is Modrinth.
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="$(ls build/libs/biome-golf-*.jar | grep -v -- '-sources\.jar$' | sort -V | tail -n1)"
          echo "Attaching ${JAR}"
          gh release create "${GITHUB_REF_NAME}" "${JAR}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth
